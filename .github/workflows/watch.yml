name: Pokemon restock watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # lets you press a "Run" button to test it

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Run the watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watcher.py

      - name: Save what it remembers
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update memory" && git push)
